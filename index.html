<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پایگاه حقیقت علمی | Web3 DApp</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.ethers.io/lib/ethers-5.2.umd.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;700&display=swap');
        body { font-family: 'Vazirmatn', sans-serif; background: #050505; color: #fff; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .locked-video { filter: blur(15px); pointer-events: none; transition: filter 0.5s ease; }
        .unlocked-video { filter: blur(0px); pointer-events: auto; }
        .page-section { display: none; }
        .page-section.active { display: block; }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="p-6 flex justify-between items-center glass">
        <h1 class="text-xl font-bold">پایگاه حقیقت علمی</h1>
        <button id="connectBtn" class="bg-purple-600 px-6 py-2 rounded-full font-bold hover:bg-purple-500 transition">
            اتصال به کیف پول
        </button>
    </header>

    <main class="container mx-auto p-6">
        <div id="userChannel" class="mb-8 hidden">
            <h2 class="text-2xl font-bold">کانال شخصی: <span id="userAddress" class="text-purple-400"></span></h2>
        </div>

        <div class="flex gap-4 mb-8">
            <button onclick="switchTab('videos')" class="px-4 py-2 border-b-2 border-purple-500">ویدیوها</button>
            <button onclick="switchTab('upload')" class="px-4 py-2 opacity-60">آپلود</button>
        </div>

        <!-- Section: Videos -->
        <section id="videosSection" class="page-section active grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Initial Locked Video Example -->
            <div class="glass rounded-2xl p-4 overflow-hidden">
                <div class="relative">
                    <video id="vid1" class="w-full rounded-lg locked-video" src="https://www.w3schools.com/html/mov_bbb.mp4"></video>
                    <div id="lock1" class="absolute inset-0 flex items-center justify-center bg-black/50">
                        <button onclick="unlockVideo('vid1', 'lock1', '0.01')" class="bg-white text-black px-4 py-2 rounded-lg font-bold">خرید دسترسی (0.01 ETH)</button>
                    </div>
                </div>
                <h3 class="mt-4 font-bold">آموزش سیاهچاله‌ها</h3>
            </div>
        </section>

        <!-- Section: Upload -->
        <section id="uploadSection" class="page-section glass p-8 rounded-2xl">
            <h2 class="text-xl mb-4">آپلود ویدیوی جدید</h2>
            <input type="text" id="vTitle" placeholder="عنوان ویدیو" class="w-full bg-black border border-gray-700 p-3 rounded-lg mb-4">
            <input type="file" id="vFile" class="mb-4 block">
            <button onclick="handleUpload()" class="bg-blue-600 px-6 py-2 rounded-lg font-bold">آپلود و ایجاد کارت</button>
        </section>
    </main>

    <script>
        // 1. Wallet Logic
        const connectBtn = document.getElementById('connectBtn');
        const userAddressSpan = document.getElementById('userAddress');
        const userChannel = document.getElementById('userChannel');

        connectBtn.addEventListener('click', async () => {
            if (window.ethereum) {
                try {
                    const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                    const account = accounts[0];
                    connectBtn.innerText = account.substring(0, 6) + '...' + account.substring(38);
                    userAddressSpan.innerText = account;
                    userChannel.classList.remove('hidden');
                    // Update URL for dynamic routing
                    const newUrl = window.location.protocol + "//" + window.location.host + window.location.pathname + '?user=' + account;
                    window.history.pushState({ path: newUrl }, '', newUrl);
                } catch (error) {
                    alert("خطا در اتصال: " + error.message);
                }
            } else {
                alert("لطفاً متامسک را نصب کنید.");
            }
        });

        // 2. Tab Switching
        function switchTab(tab) {
            document.querySelectorAll('.page-section').forEach(s => s.classList.remove('active'));
            document.getElementById(tab + 'Section').classList.add('active');
        }

        // 3. Paywall Logic
        async function unlockVideo(vidId, lockId, price) {
            if(!window.ethereum) return alert("کیف پول متصل نیست!");
            
            // Simulating Transaction
            try {
                const provider = new ethers.providers.Web3Provider(window.ethereum);
                const signer = provider.getSigner();
                
                // Actual transaction request logic (standard ethers.js)
                const tx = await signer.sendTransaction({
                    to: "0x0000000000000000000000000000000000000000", // Dummy address for simulation
                    value: ethers.utils.parseEther(price)
                });
                
                alert("تراکنش در حال پردازش...");
                await tx.wait();
                
                // Unlock UI
                document.getElementById(vidId).classList.remove('locked-video');
                document.getElementById(vidId).classList.add('unlocked-video');
                document.getElementById(lockId).classList.add('hidden');
            } catch (e) {
                alert("تراکنش لغو شد یا ناموفق بود.");
            }
        }

        // 4. Upload & Rendering Logic
        function handleUpload() {
            const file = document.getElementById('vFile').files[0];
            const title = document.getElementById('vTitle').value;
            if (!file) return alert("فایل انتخاب کنید");

            const videoUrl = URL.createObjectURL(file);
            const grid = document.getElementById('videosSection');
            
            const newCard = document.createElement('div');
            newCard.className = 'glass rounded-2xl p-4 overflow-hidden';
            newCard.innerHTML = `
                <div class="relative">
                    <video class="w-full rounded-lg" controls src="${videoUrl}"></video>
                </div>
                <h3 class="mt-4 font-bold">${title}</h3>
                <span class="text-green-500 text-sm">آپلود شده (بدون قفل)</span>
            `;
            grid.appendChild(newCard);
            switchTab('videos');
        }

        // Check for user parameter on load
        window.onload = () => {
            const urlParams = new URLSearchParams(window.location.search);
            const user = urlParams.get('user');
            if (user) {
                userAddressSpan.innerText = user;
                userChannel.classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
